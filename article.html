<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article — QuickQuiz</title>
<style>
  :root{
    --ink:#12101c; --ink-2:#1c1930; --buzzer:#ff3b3b; --gold:#ffc93c;
    --cream:#f4f1ff; --ok:#3ade7a; --muted:#a49bc7;
    --font-display:'Unbounded', system-ui, sans-serif;
    --font-body:'Inter', system-ui, sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--ink);color:var(--cream);font-family:var(--font-body);line-height:1.6;}
  a{color:inherit !important;text-decoration:none;}

  nav{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 6%;
    background:rgba(18,16,28,0.9);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(244,241,255,0.08);
  }
  .logo{font-family:var(--font-display);font-weight:900;font-size:1.3rem;}
  .logo span{color:var(--buzzer);}
  .back-link{
    font-size:0.85rem;font-weight:600;color:var(--muted);
    display:flex;align-items:center;gap:6px;
  }
  .back-link:hover{color:var(--cream);}

  main{max-width:840px;margin:0 auto;padding:50px 6% 100px;}
  .article-card{
    background:var(--ink-2);
    border:1px solid rgba(244,241,255,0.08);
    border-radius:24px;
    padding:44px;
  }
  .post-type{
    display:inline-block;font-size:0.75rem;font-weight:700;color:var(--ink);
    background:var(--gold);padding:4px 12px;border-radius:100px;margin-bottom:18px;text-transform:uppercase;
  }
  h1{
    font-family:var(--font-display);
    font-size:clamp(1.8rem,4vw,2.6rem);
    font-weight:800;
    line-height:1.15;
    margin-bottom:24px;
    color:var(--cream);
    text-align:left;
  }
  .meta{color:var(--muted);font-size:0.85rem;margin-bottom:28px;}
  .media-wrap img, .media-wrap video{
    width:100%;border-radius:16px;margin-bottom:32px;display:block;
    max-height:480px;object-fit:cover;
  }
  .article-body{
    font-size:1.08rem;
    color:var(--cream);
    white-space:pre-wrap;
  }
  .article-body p{margin-bottom:1.2em;}
  /* Neutralise tout style importé dans le contenu (couleur, centrage, police)
     pour que l'article reste toujours lisible, quel que soit le texte collé. */
  .article-body *{
    color:var(--cream) !important;
    background:transparent !important;
    text-align:left !important;
    font-family:var(--font-body) !important;
  }
  .article-body strong, .article-body b{
    color:var(--gold) !important;
    font-weight:700 !important;
  }
  .article-body h1, .article-body h2, .article-body h3{
    font-family:var(--font-display) !important;
    font-size:1.3rem !important;
    margin:28px 0 14px !important;
  }

  .state-msg{color:var(--muted);text-align:center;padding:80px 20px;font-size:0.95rem;}

  .cta-bottom{
    margin-top:60px;
    padding:30px;
    border-radius:18px;
    background:var(--ink-2);
    border:1px solid rgba(255,201,60,0.2);
    text-align:center;
  }
  .cta-bottom p{color:var(--muted);margin-bottom:16px;font-size:0.9rem;}
  .btn-primary{
    background:var(--buzzer);color:white;font-weight:700;
    padding:13px 24px;border-radius:100px;display:inline-block;font-size:0.9rem;
  }
</style>
</head>
<body>

<nav>
  <div class="logo">Quick<span>Quiz</span></div>
  <a href="index.html" class="back-link">← Retour au site</a>
</nav>

<main id="mainContent">
  <p class="state-msg">Chargement de l'article...</p>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const postId = params.get('id');
  const main = document.getElementById('mainContent');

  if(!postId){
    main.innerHTML = '<p class="state-msg">Article introuvable — aucun identifiant fourni.</p>';
  } else if(typeof db === 'undefined'){
    main.innerHTML = '<p class="state-msg">Connexion à la base de données impossible.</p>';
  } else {
    db.collection('posts').doc(postId).get().then(doc=>{
      if(!doc.exists){
        main.innerHTML = '<p class="state-msg">Cet article n\'existe plus.</p>';
        return;
      }
      const p = doc.data();
      let media = '';
      if(p.mediaUrl && p.mediaType === 'image') media = `<div class="media-wrap"><img src="${p.mediaUrl}" alt="${p.title}"></div>`;
      if(p.mediaUrl && p.mediaType === 'video') media = `<div class="media-wrap"><video src="${p.mediaUrl}" controls></video></div>`;

      const typeLabel = p.type === 'blog' ? 'Blog' : p.type === 'actu' ? 'Actu' : 'Média';

      document.title = p.title + ' — QuickQuiz';
      main.innerHTML = `
        <div class="article-card">
          <span class="post-type">${typeLabel}</span>
          <h1>${p.title}</h1>
          ${media}
          <div class="article-body">${(p.content || '').replace(/\n/g,'<br>')}</div>
          <div class="cta-bottom">
            <p>Envie de tester tes connaissances ?</p>
            <a href="index.html#categories" class="btn-primary">Lancer un quiz</a>
          </div>
        </div>
      `;
    }).catch(err=>{
      main.innerHTML = '<p class="state-msg">Erreur de chargement : ' + err.message + '</p>';
    });
  }
</script>
</body>
</html>
